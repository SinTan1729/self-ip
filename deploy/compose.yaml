services:
  self-ip:
    container_name: self-ip
    image: ghcr.io/sintan1729/self-ip:latest
    restart: on-failure:5
    ports:
      - '3213:3213' # Adjust if needed

    environment:
      # CHANGE IT BEFORE DEPLOYMENT, THIS IS GIBBERISH
      SELF_IP_API_KEY: 'YlhMtBSKiSDuu9PiEinQWWA5QcFmoe0Lmar1g2N0m9vwYZoh67XeTTzbl0eKL14FUEjqBJwnr5SUli25wxjuew'
      SELF_IP_API_KEY_HASH_ALGORITHM: SHA512
      # SELF_IP_TRUSTED_PROXIES: 10.89.0.0/24
      # SELF_IP_LISTEN_ADDR: 0.0.0.0
      # SELF_IP_LISTEN_PORT: 1122
      # SELF_IP_ENABLE_PORT_CHECKER: True
      # SELF_IP_ENABLE_HOSTNAME: True
      TZ: Asia/Kolkata
    healthcheck:
      test: CMD-SHELL wget -qO- http://127.0.0.1:1729/healthz || exit 1
      interval: 60s
      retries: 3
      start_period: 10s
      timeout: 10s

    volumes:
      - self-ip:/app/maxmind-databases

volumes:
  self-ip:
