name: Go Tests

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Create env
        run: |
          cat > .env <<'EOF'
          API_KEY=dummy_api_key_for_testing
          SELF_IP_API_KEY=NLPSiKuhE8Ph7BAgxVQgpAMoqey2piO4YGQYRKP3o4ISD7saL4JJ8WI_MAa3Y2ZhQ7nbTiNoDs_1PTyKuPiFdA
          SELF_IP_API_KEY_HASH_ALGORITHM=SHA512
          EOF

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go test ./handlers
